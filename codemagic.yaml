# Configuration for SoundBridge Managed Expo iOS App Store Deployment
workflows:
  ios-release:
    name: SoundBridge iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    
    integrations:
      app_store_connect: soundbridge_api

    environment:
      node: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.soundbridge.app"
      vars:
        BUNDLE_ID: "com.soundbridge.app"
        XCODE_WORKSPACE: "ios/SoundBridge.xcworkspace" 
        XCODE_SCHEME: "SoundBridge"               

    scripts:
      - name: 1. Install Node Dependencies
        script: |
          pnpm install 

      - name: 2. Generate Native iOS Directory (Expo Prebuild)
        script: |
          npx expo prebuild --platform ios

      - name: 3. Patch Target Floors & Modulemaps Surgically
        script: |
          echo "Fixing missing gRPC modulemaps for Explicit Modules..."
          mkdir -p ios/Pods/Headers/Private/grpc
          find ios/Pods -name "gRPC-Core.modulemap" -exec cp {} ios/Pods/Headers/Private/grpc/gRPC-Core.modulemap \;
          find ios/Pods -name "gRPC-C++.modulemap" -exec cp {} ios/Pods/Headers/Private/grpc/gRPC-C++.modulemap \;
          echo "✅ gRPC modulemaps successfully mapped into place."

          echo "Executing Ruby script for localized target adjustments..."
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Pods/Pods.xcodeproj')
          
          # Only isolate targets that explicitly cause issues
          legacy_targets = [
            'gRPC-Core', 
            'gRPC-C++', 
            'BoringSSL-GRPC', 
            'FirebaseFirestoreInternal', 
            'FirebaseCore', 
            'FirebaseFirestore', 
            'FirebaseSharedSwift'
          ]
          
          project.targets.each do |target|
            # 1. Isolate and lift ExpoSymbols up to iOS 16.0 safely
            if target.name == 'ExpoSymbols'
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
              end
              puts 'Surgically adjusted ExpoSymbols to iOS 16.0'
            end
            
            # 2. Quiet down the legacy explicit modules scanning only for problem pods
            if legacy_targets.include?(target.name)
              target.build_configurations.each do |config|
                config.build_settings['CLANG_EXPLICIT_MODULES'] = 'NO'
                config.build_settings['CLANG_ENABLE_MODULE_VERIFIER'] = 'NO'
                config.build_settings['USE_HEADERMAP'] = 'NO'
                
                val = config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'].to_f
                if val < 14.0 && val > 0
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
                end
              end
              
              target.build_phases.each do |phase|
                next unless phase.respond_to?(:files)
                phase.files.each do |file|
                  if file.file_ref && file.file_ref.respond_to?(:path) && file.file_ref.path && file.file_ref.path.end_with?('.m')
                    file.settings ||= {}
                    file.settings['COMPILER_FLAGS'] = '-x objective-c++'
                  end
                end
              end
              puts \"Surgically sandboxed legacy target: #{target.name}\"
            end
          end
          
          project.save
          "
          echo "✅ Localized patch complete. Stripe and core framework targets left in native state."

      - name: 4. Apply manual profiles to the newly generated Xcode project
        script: |
          xcode-project use-profiles --project ios/*.xcodeproj

      - name: 5. Build Signed iOS App (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --disable-xcpretty \
            --archive-flags="-destination 'generic/platform=iOS' COMPILER_INDEX_STORE_ENABLE=NO"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true     
        submit_to_app_store: false