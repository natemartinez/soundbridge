# Configuration for SoundBridge iOS App Store Deployment
workflows:
  ios-release:
    name: SoundBridge iOS Release
    
    # 1. Connected Developer Portal API Integration
    integrations:
      app_store_connect: soundbridge_api

    environment:
      groups:
        - manual_credentials # Optional: For storing any extra secure environment vars
      vars:
        XCODE_WORKSPACE: "SoundBridge.xcworkspace" # Change to .xcodeproj if not using CocoaPods/Swift Packages
        XCODE_SCHEME: "SoundBridge"               # Replace with your specific Xcode Scheme name
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.soundbridge.app

    scripts:
      - name: Ensure Production Entitlements
        script: |
          # The ios/ directory is gitignored (generated by expo prebuild).
          # Ensure aps-environment is set to production for App Store builds.
          ENTITLEMENTS_PATH="$CM_BUILD_DIR/ios/SoundBridge/SoundBridge.entitlements"
          if [ -f "$ENTITLEMENTS_PATH" ]; then
            plutil -replace aps-environment -string "production" "$ENTITLEMENTS_PATH"
            echo "Set aps-environment to production in entitlements"
          else
            echo "Warning: Entitlements file not found at $ENTITLEMENTS_PATH"
          fi

      - name: Fetch or Create Profiles and Certificates
        script: |
          # The --create flag tells Codemagic to provision the profile on Apple if missing
          xcode-project use-profiles --create

      - name: Build iOS App (.ipa)
        script: |
          # Builds and packages the app for App Store distribution
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --configuration Release

    # 2. Automated Pipeline Distribution to Apple
    publishing:
      app_store_connect:
        auth: integration
        
        # Deployment Preferences
        submit_to_testflight: true     # Pushes build directly into TestFlight processing
        submit_to_app_store: false     # Keeps it as a draft build (set to true to auto-submit for official review)
