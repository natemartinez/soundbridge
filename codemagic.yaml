workflows:
  ios-release:
    name: SoundBridge iOS Release
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.soundbridge.app
      vars:
        BUNDLE_ID: "com.soundbridge.app"
        XCODE_WORKSPACE: "ios/SoundBridge.xcworkspace"
        XCODE_SCHEME: "SoundBridge"
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Set up EAS / Expo prebuild
        script: |
          npx expo prebuild --clean
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build iOS app for App Store
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
