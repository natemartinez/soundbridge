# Configuration for SoundBridge Managed Expo iOS App Store Deployment
workflows:
  ios-release:
    name: SoundBridge iOS Release
    
    # Links your App Store Connect API key integration
    integrations:
      app_store_connect: soundbridge_api

    environment:
      node: latest
      vars:
        BUNDLE_ID: "com.soundbridge.app"
        XCODE_WORKSPACE: "ios/SoundBridge.xcworkspace" # Generated dynamically by Expo Prebuild
        XCODE_SCHEME: "SoundBridge"               # Typically matches the 'name' field in your app.json

    scripts:
      - name: 1. Install Node Dependencies
        script: |
          # Installs dependencies needed to execute expo commands
          npm install 

      - name: 2. Generate Native iOS Directory (Expo Prebuild)
        script: |
          # Crucial step: This builds the transient /ios directory on the fly
          npx expo prebuild --platform ios

      - name: 3. Initialize macOS Keychain
        script: |
          # Creates a temporary secure keychain environment on the cloud Mac
          keychain initialize

      - name: 4. Fetch or Create Certificates and Profiles from Apple
        script: |
          # Dynamically provisions your distribution certificates and profiles on Apple
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create

      - name: 5. Add generated certificates to Keychain
        script: |
          keychain add-certificates

      - name: 6. Apply profiles to the newly generated Xcode project
        script: |
          # Maps the freshly minted profiles to the ios folder generated in step 2
          xcode-project use-profiles

      - name: 7. Build Signed iOS App (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --configuration Release

    # Sends the resulting production build to TestFlight
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true     
        submit_to_app_store: false